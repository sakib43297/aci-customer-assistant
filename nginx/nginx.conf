worker_processes 1;
error_log /tmp/aci-customer-assistant-nginx-error.log warn;
pid /tmp/aci-customer-assistant-nginx.pid;

events { worker_connections 1024; }

http {
  access_log /tmp/aci-customer-assistant-nginx-access.log;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/aci-customer-assistant-client_body;
  proxy_temp_path /tmp/aci-customer-assistant-proxy;
  limit_req_zone $binary_remote_addr zone=aci_api:10m rate=30r/m;
  upstream aci_customer_assistant_internal { server app:8080; }

  server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 2m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    location ~* \.map$ { return 404; }
    location ~ ^/metrics(/|$) { allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all; proxy_pass http://aci_customer_assistant_internal; }
    location ~ ^/(docs|redoc|openapi\\.json)(/|$) { return 404; }
    location / {
      limit_req zone=aci_api burst=20 nodelay;
      proxy_pass http://aci_customer_assistant_internal;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_connect_timeout 5s;
      proxy_buffering on;
    }
  }
}
