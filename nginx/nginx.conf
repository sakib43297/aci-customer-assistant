worker_processes 1;
pid /tmp/aci-customer-assistant-nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format proxy_audit '$remote_addr proxy=$realip_remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout proxy_audit;
  error_log /dev/stderr warn;
  server_tokens off;
  include /etc/nginx/trusted-proxies.conf;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  geo $realip_remote_addr $trusted_ingress_proxy {
    default 0;
    include /etc/nginx/trusted-proxy-geo.conf;
  }

  geo $remote_addr $client_is_private {
    default 0;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    127.0.0.1/32 1;
    ::1/128 1;
  }

  geo $remote_addr $client_is_trusted_proxy_address {
    default 0;
    include /etc/nginx/trusted-proxy-geo.conf;
  }

  map "$trusted_ingress_proxy:$client_is_trusted_proxy_address" $deny_unresolved_proxy_client {
    default 0;
    "1:1" 1;
  }
  limit_req_zone $binary_remote_addr zone=aci_api:10m rate=30r/m;
  upstream aci_customer_assistant_internal { server app:8080; }

  server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 2m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location ~* \.map$ { return 404; }

    location ~ ^/(metrics|docs|redoc|openapi\.json|api/docs|api/redoc|api/openapi\.json)(/|$) {
      if ($deny_unresolved_proxy_client) { return 403; }
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://aci_customer_assistant_internal;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      limit_req zone=aci_api burst=20 nodelay;
      proxy_pass http://aci_customer_assistant_internal;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering on;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }
  }
}
