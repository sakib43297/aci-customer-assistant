name: aci-customer-assistant

services:
  app:
    image: registry.acimisai.com/aci-customer-assistant-app:${IMAGE_TAG:-v1}
    platform: linux/amd64
    container_name: aci_customer_assistant_prod_app
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: 0.0.0.0
      DATABASE_PATH: /project/aci-platform.sqlite
      APP_URL: ${APP_URL:-http://localhost:2312}
      ADMIN_ID: ${ADMIN_ID:?Set ADMIN_ID in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./data:/project
    networks: [aci-customer-assistant-net]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  aci-customer-assistant-nginx:
    image: nginx:1.27-alpine
    container_name: aci_customer_assistant_prod_nginx
    restart: unless-stopped
    environment:
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set TRUSTED_PROXY_CIDRS in .env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${NGINX_BIND_ADDRESS:-0.0.0.0}:${NGINX_PORT:?Set NGINX_PORT in .env}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/trusted-proxy-entrypoint.sh:/docker-entrypoint.d/20-trusted-proxy-entrypoint.sh:ro
    networks:
      - aci-customer-assistant-net
      - acimisai_tunnel_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  prometheus:
    image: prom/prometheus:v3.5.0
    platform: linux/amd64
    container_name: aci_customer_assistant_prod_prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker-data/prometheus:/prometheus
    depends_on:
      app:
        condition: service_healthy
    networks: [aci-customer-assistant-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.1.0
    platform: linux/amd64
    container_name: aci_customer_assistant_prod_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:?Set GRAFANA_PORT in .env}:3000"
    volumes:
      - ./docker-data/grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [aci-customer-assistant-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

networks:
  aci-customer-assistant-net:
    name: aci-customer-assistant-net
    driver: bridge
  acimisai_tunnel_network:
    name: acimisai_tunnel_network
    external: true
