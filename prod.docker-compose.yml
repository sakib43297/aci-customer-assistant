name: aci-customer-assistant

services:
  app:
    image: registry.acimisai.com/aci-customer-assistant-app:${IMAGE_TAG:-v1}
    platform: linux/amd64
    environment:
      NODE_ENV: production
      DATABASE_PATH: /project/aci-platform.sqlite
      HOST: 0.0.0.0
      PORT: 8080
      APP_URL: ${APP_URL:-http://localhost:2312}
      ADMIN_ID: ${ADMIN_ID:?Set ADMIN_ID in .env or the shell before starting}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env or the shell before starting}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or the shell before starting}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in .env or the shell before starting}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env or the shell before starting}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes: [./data:/project]
    networks: [private]
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped
    init: true

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app: { condition: service_healthy }
    ports: ["${NGINX_BIND_ADDRESS:-0.0.0.0}:${NGINX_PORT:-2312}:80"]
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    networks: [private, acimisai_tunnel_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus]
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus-data:/prometheus]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env or the shell before starting}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: [grafana-data:/var/lib/grafana, ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro, ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    networks: [private]
    depends_on: [prometheus]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  prometheus-data:
  grafana-data:

networks:
  private: { driver: bridge, internal: true }
  acimisai_tunnel_network: { external: true }
