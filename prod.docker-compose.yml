name: aci-customer-assistant

services:
  app:
    image: registry.acimisai.com/aci-customer-assistant-app:${IMAGE_TAG:-v1}
    platform: linux/amd64
    container_name: aci_customer_assistant_prod_app
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: 0.0.0.0
      DATABASE_PATH: /project/aci-platform.sqlite
      APP_URL: ${APP_URL:-http://localhost:2312}
      ADMIN_ID: ${ADMIN_ID:?Set ADMIN_ID in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./data:/project
    networks: [aci-customer-assistant-net]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  aci-customer-assistant-nginx:
    image: nginx:1.27-alpine
    container_name: aci_customer_assistant_prod_nginx
    restart: unless-stopped
    environment:
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set TRUSTED_PROXY_CIDRS in .env}
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/trusted-proxy-entrypoint.sh:/docker-entrypoint.d/20-trusted-proxy-entrypoint.sh:ro
    networks:
      - aci-customer-assistant-net
      - acimisai_tunnel_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

networks:
  aci-customer-assistant-net:
    name: aci-customer-assistant-net
    driver: bridge
  acimisai_tunnel_network:
    name: acimisai_tunnel_network
    external: true
